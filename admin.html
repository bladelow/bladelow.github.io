<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BladeLow admin</title>
<link rel="icon" href="pfp.jpg">
<style>
  :root { --ink:#0c130e; --ink2:#15201a; --steel:#9db89a; --ice:#eef5ec; --edge:#57d13d; --line:#243428; --bad:#ff6b5e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--ice); font: 16px/1.5 "Segoe UI", system-ui, Arial, sans-serif; }
  a { color: var(--edge); }
  :focus-visible { outline: 3px solid var(--edge); outline-offset: 2px; }

  .top { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
         padding: 0.7rem 1.2rem; background: var(--ink); border-bottom: 1px solid var(--line); }
  .top b { font-size: 1.1rem; font-style: italic; font-weight: 900; }
  #status { color: var(--steel); }
  #status.dirty { color: var(--edge); font-weight: 700; }

  .layout { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 56px); }
  nav { display: flex; flex-direction: column; gap: 0.2rem; padding: 1rem 0.6rem; border-right: 1px solid var(--line); }
  nav button { text-align: left; padding: 0.55rem 0.8rem; background: none; color: var(--steel); border: 0; border-left: 3px solid transparent; font: inherit; font-weight: 600; cursor: pointer; }
  nav button:hover { color: var(--ice); }
  nav button[aria-current="true"] { color: var(--ice); border-left-color: var(--edge); background: var(--ink2); }
  main { padding: 1.5rem 2rem 4rem; max-width: 880px; }
  h2 { margin: 0 0 0.3rem; font-size: 1.6rem; }
  .desc { margin: 0 0 1.4rem; color: var(--steel); max-width: 60ch; }

  .field { display: block; margin-bottom: 1rem; }
  .lab { display: block; margin-bottom: 0.25rem; font-weight: 600; }
  .hint { display: block; margin-top: 0.2rem; color: var(--steel); font-size: 0.85rem; }
  input, textarea, select { width: 100%; padding: 0.55rem 0.7rem; background: var(--ink2); color: var(--ice); border: 1px solid var(--line); font: inherit; }
  input[type="color"] { padding: 0.15rem; height: 2.6rem; width: 5rem; }
  input[type="checkbox"] { width: auto; }
  textarea { resize: vertical; }
  .row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 1rem; }

  .card { padding: 1rem 1.1rem 0.2rem; margin-bottom: 1rem; background: var(--ink2); border-left: 3px solid var(--edge); }
  .cardhead { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
  .acts { display: flex; gap: 0.3rem; }
  .mini { padding: 0.2rem 0.6rem; background: none; color: var(--steel); border: 1px solid var(--line); font: inherit; font-size: 0.85rem; cursor: pointer; }
  .mini:hover { color: var(--ice); border-color: var(--steel); }
  .mini.danger:hover { color: var(--bad); border-color: var(--bad); }

  .btn { padding: 0.65rem 1.2rem; background: var(--edge); color: var(--ink); border: 2px solid var(--edge); font: inherit; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: none; color: var(--ice); }
  .btn:hover { background: var(--ice); border-color: var(--ice); color: var(--ink); }
  .btn:disabled { opacity: 0.5; cursor: wait; }
  .btns { display: flex; flex-wrap: wrap; gap: 0.7rem; margin: 1rem 0; }

  .msg { padding: 0.8rem 1rem; margin: 1rem 0; background: var(--ink2); border-left: 3px solid var(--steel); }
  .msg.ok { border-color: var(--edge); }
  .msg.err { border-color: var(--bad); color: var(--bad); }
  .warn { padding: 0.8rem 1rem; margin: 0 0 1.4rem; border: 1px dashed var(--steel); color: var(--steel); max-width: 62ch; }
  pre, #out { font: 13px/1.4 Consolas, monospace; }
  #out { height: 260px; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
    nav button { border-left: 0; border-bottom: 3px solid transparent; }
    nav button[aria-current="true"] { border-bottom-color: var(--edge); }
    main { padding: 1.2rem 1rem 4rem; }
  }
</style>
</head>
<body>

<div class="top">
  <b>BladeLow admin</b>
  <span id="status">No changes yet</span>
  <a href="index.html">Back to site</a>
</div>
<div class="layout">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="panel"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(async () => {
  await loadRemoteConfig();
  if (!(await requireAdmin())) return;
  if (typeof SITE === "undefined") {
    document.getElementById("panel").textContent = "config.js could not be loaded. Keep admin.html in the same folder as config.js.";
    throw new Error("config.js missing");
  }

  // ---------- Theme from the site's own config ----------
  const T0 = SITE.theme || {};
  const root = document.documentElement.style;
  if (T0.accent) root.setProperty("--edge", T0.accent);
  if (T0.muted) root.setProperty("--steel", T0.muted);
  if (T0.bg) root.setProperty("--ink", T0.bg);
  if (T0.panel) root.setProperty("--ink2", T0.panel);
  if (T0.text) root.setProperty("--ice", T0.text);

  // ---------- State: ek copy jise hum edit karte hai ----------
  const state = JSON.parse(JSON.stringify(SITE));
  state.theme = Object.assign({ accent: "#57d13d", muted: "#9db89a", bg: "#0c130e", panel: "#15201a", text: "#eef5ec" }, state.theme || {});
  state.stats = Object.assign({ subscribers: "", discordMembers: "", goal: "", youtubeApiKey: "", discordInviteCode: "" }, state.stats || {});
  state.giscus = Object.assign({ repo: "", repoId: "", category: "", categoryId: "" }, state.giscus || {});
  ["heroButtons", "about", "socials", "addons", "upcoming", "team", "pages", "posts"].forEach(k => { if (!Array.isArray(state[k])) state[k] = []; });
  ["name", "pageTitle", "tagline", "avatar", "footer", "youtubeChannelId", "featuredVideoId", "featuredPlaylistId",
   "discordInvite", "discordServerId", "redditUrl", "communityText", "ideasIntro"].forEach(k => { if (state[k] === undefined) state[k] = ""; });
  if (!state.videoFeed) state.videoFeed = "popular";

  // ---------- Helpers ----------
  const $ = id => document.getElementById(id);
  function el(tag, attrs, text) {
    const e = document.createElement(tag);
    for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }
  let dirty = false;
  function touch() {
    dirty = true;
    $("status").textContent = "Unsaved changes";
    $("status").className = "dirty";
  }
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  const ICONS = ["youtube", "instagram", "discord", "curseforge", "reddit", "link"];

  // Ek input/textarea/select jo seedha state se bandha hota hai
  function field(label, obj, key, o) {
    o = o || {};
    const wrap = el("label", { class: "field" });
    wrap.appendChild(el("span", { class: "lab" }, label));
    let inp;
    if (o.type === "textarea") {
      inp = el("textarea", { rows: o.rows || 3 });
    } else if (o.type === "select") {
      inp = el("select");
      o.options.forEach(op => inp.appendChild(el("option", { value: op }, op)));
    } else {
      inp = el("input", { type: o.type || "text" });
    }
    inp.value = obj[key] === undefined ? "" : obj[key];
    const upd = () => {
      let v = inp.value;
      if (o.type === "number") v = v === "" ? "" : Number(v);
      obj[key] = v;
      touch();
    };
    inp.addEventListener("input", upd);
    inp.addEventListener("change", upd);
    wrap.appendChild(inp);
    if (o.hint) wrap.appendChild(el("small", { class: "hint" }, o.hint));
    return wrap;
  }

  // Cards ki list: add, remove, up, down
  function listEditor(container, arr, schema, blank, titleFn) {
    function render() {
      container.textContent = "";
      arr.forEach((item, i) => {
        const card = el("div", { class: "card" });
        const head = el("div", { class: "cardhead" });
        head.appendChild(el("b", {}, titleFn(item, i)));
        const acts = el("div", { class: "acts" });
        [["Up", -1], ["Down", 1]].forEach(pair => {
          const b = el("button", { type: "button", class: "mini" }, pair[0]);
          b.addEventListener("click", () => {
            const j = i + pair[1];
            if (j < 0 || j >= arr.length) return;
            const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
            touch(); render();
          });
          acts.appendChild(b);
        });
        const rm = el("button", { type: "button", class: "mini danger" }, "Remove");
        rm.addEventListener("click", () => {
          if (!confirm("Remove this item?")) return;
          arr.splice(i, 1); touch(); render();
        });
        acts.appendChild(rm);
        head.appendChild(acts);
        card.appendChild(head);
        schema.forEach(s => card.appendChild(field(s.label, item, s.key, s)));
        container.appendChild(card);
      });
      const add = el("button", { type: "button", class: "btn ghost" }, "+ Add new");
      add.addEventListener("click", () => { arr.push(Object.assign({}, blank)); touch(); render(); });
      container.appendChild(add);
    }
    render();
  }

  // Simple text paragraphs ki list (About ke liye)
  function textList(container, arr) {
    function render() {
      container.textContent = "";
      arr.forEach((txt, i) => {
        const card = el("div", { class: "card" });
        const head = el("div", { class: "cardhead" });
        head.appendChild(el("b", {}, "Paragraph " + (i + 1)));
        const rm = el("button", { type: "button", class: "mini danger" }, "Remove");
        rm.addEventListener("click", () => { arr.splice(i, 1); touch(); render(); });
        head.appendChild(rm);
        card.appendChild(head);
        const ta = el("textarea", { rows: 4 });
        ta.value = txt;
        ta.addEventListener("input", () => { arr[i] = ta.value; touch(); });
        const wrap = el("div", { class: "field" });
        wrap.appendChild(ta);
        card.appendChild(wrap);
        container.appendChild(card);
      });
      const add = el("button", { type: "button", class: "btn ghost" }, "+ Add paragraph");
      add.addEventListener("click", () => { arr.push(""); touch(); render(); });
      container.appendChild(add);
    }
    render();
  }

  function head(p, title, desc) {
    p.appendChild(el("h2", {}, title));
    if (desc) p.appendChild(el("p", { class: "desc" }, desc));
  }

  // ---------- Config text banana ----------
  function buildConfig() {
    const clean = JSON.parse(JSON.stringify(state));
    return "/* BladeLow site config. admin.html se generate hua hai.\n   Chahe to yahan haath se bhi edit kar sakta hai. */\n\nconst SITE = " +
      JSON.stringify(clean, null, 2) + ";\n";
  }

  // ---------- Sections ----------
  const SECTIONS = {
    "General": p => {
      head(p, "General", "Site name, tagline aur colors.");
      p.appendChild(field("Site name", state, "name"));
      p.appendChild(field("Browser tab title", state, "pageTitle"));
      p.appendChild(field("Tagline", state, "tagline", { type: "textarea", rows: 2 }));
      p.appendChild(field("Profile picture file", state, "avatar", { hint: "File name, e.g., pfp.jpg. For a new photo, replace the file in the GitHub repo with one using the same name." }));
      p.appendChild(field("Footer text", state, "footer"));
      p.appendChild(el("h3", {}, "Colors"));
      const grid = el("div", { class: "row2" });
      [["accent", "Main color (buttons, lines)"], ["muted", "Soft text"], ["bg", "Page background"], ["panel", "Card background"], ["text", "Text"]]
        .forEach(c => grid.appendChild(field(c[1], state.theme, c[0], { type: "color" })));
      p.appendChild(grid);
    },
    "Hero buttons": p => {
      head(p, "Hero buttons", "Large buttons at the top of the home page. The first button appears filled.");
      const box = el("div"); p.appendChild(box);
      listEditor(box, state.heroButtons, [
        { label: "Button text", key: "text" },
        { label: "Link", key: "url" },
        { label: "Icon", key: "icon", type: "select", options: ICONS }
      ], { text: "New button", url: "#", icon: "link" }, it => it.text || "Button");
    },
    "About": p => {
      head(p, "About", "Home page intro. Each item is a paragraph..");
      const box = el("div"); p.appendChild(box);
      textList(box, state.about);
    },
    "Links": p => {
      head(p, "Social links", "Tere saare social links.");
      const box = el("div"); p.appendChild(box);
      listEditor(box, state.socials, [
        { label: "Name", key: "name" },
        { label: "Link", key: "url" },
        { label: "Short note", key: "note" },
        { label: "Icon", key: "icon", type: "select", options: ICONS }
      ], { name: "New link", url: "#", note: "", icon: "link" }, it => it.name || "Link");
    },
    "Stats": p => {
      head(p, "Stats", "Numbers on the home page. If auto-fetch fails, the numbers are displayed manually..");
      const grid = el("div", { class: "row2" });
      grid.appendChild(field("YouTube subscribers (manual)", state.stats, "subscribers"));
      grid.appendChild(field("Discord members (manual)", state.stats, "discordMembers"));
      grid.appendChild(field("Subscriber goal", state.stats, "goal", { type: "number", hint: "For a progress bar for example, 1000 an empty state means no bar is displayed." }));
      grid.appendChild(field("Discord invite code", state.stats, "discordInviteCode", { hint: "discord.gg/abc123 ho to abc123. Invite never-expire wala ho." }));
      p.appendChild(grid);
      p.appendChild(field("YouTube API key (optional)", state.stats, "youtubeApiKey", { hint: "This goes into the site's public files, so restrict it in Google Cloud using the HTTP Referer." }));
    },
    "Projects": p => {
      head(p, "Addons and projects", "Projects tab ke addons.");
      const box = el("div"); p.appendChild(box);
      listEditor(box, state.addons, [
        { label: "Name", key: "name" },
        { label: "Description", key: "desc", type: "textarea", rows: 3 },
        { label: "CurseForge link", key: "url" }
      ], { name: "New addon", desc: "", url: "#" }, it => it.name || "Addon");
      p.appendChild(el("h2", { style: "margin-top:2.5rem" }, "Upcoming content"));
      const box2 = el("div"); p.appendChild(box2);
      listEditor(box2, state.upcoming, [
        { label: "Title", key: "title" },
        { label: "Status", key: "status", hint: "Like planning, in progress, both" },
        { label: "Description", key: "desc", type: "textarea", rows: 2 }
      ], { title: "New plan", status: "Planning", desc: "" }, it => it.title || "Plan");
    },
    "Pages": p => {
      head(p, "Custom pages", "Create new pages here. Once published, a page will be accessible via `page.html?slug=your-slug`.");
      const box = el("div"); p.appendChild(box);
      listEditor(box, state.pages, [
        { label: "Page title", key: "title" },
        { label: "URL slug (English, no spaces)", key: "slug", hint: "Example: about, rules, contact" },
        { label: "Short description", key: "description", type: "textarea", rows: 2 },
        { label: "Page content (plain text; blank lines create paragraphs)", key: "content", type: "textarea", rows: 8 }
      ], { title: "New page", slug: "new-page", description: "", content: "Write your page here." }, it => it.title || "Untitled page");
    },
    "Posts": p => {
      head(p, "Posts and updates", "New project updates, announcements, and blog posts add here.");
      const box = el("div"); p.appendChild(box);
      listEditor(box, state.posts, [
        { label: "Post title", key: "title" },
        { label: "URL slug (English, no spaces)", key: "slug" },
        { label: "Date label", key: "date", hint: "Example: 27 Oct 2026" },
        { label: "Summary", key: "summary", type: "textarea", rows: 2 },
        { label: "Post content (plain text; blank lines create paragraphs)", key: "content", type: "textarea", rows: 8 },
        { label: "Project / post link (optional)", key: "url" }
      ], { title: "New post", slug: "new-post", date: "", summary: "", content: "", url: "" }, it => it.title || "Untitled post");
    },
    "Video": p => {
      head(p, "Home page video", "Kaunsa video home page pe chale. Upar se neeche priority: video, playlist, feed.");
      p.appendChild(field("Featured video (link ya ID)", state, "featuredVideoId", { hint: "Ek specific video hamesha dikhane ke liye." }));
      p.appendChild(field("Featured playlist (link ya ID)", state, "featuredPlaylistId", { hint: "Playlist me jo video sabse upar hoga wahi pehle chalega." }));
      p.appendChild(field("Automatic feed", state, "videoFeed", { type: "select", options: ["popular", "videos", "uploads"], hint: "popular = home page ka popular video, videos = naya upload (Shorts ke bina), uploads = sab naye uploads." }));
      p.appendChild(field("YouTube channel ID", state, "youtubeChannelId", { hint: "UC se shuru hota hai." }));
    },
    "Community": p => {
      head(p, "Community", "Discord, subreddit aur team.");
      p.appendChild(field("Community text", state, "communityText", { type: "textarea", rows: 2 }));
      p.appendChild(field("Discord invite link", state, "discordInvite"));
      p.appendChild(field("Discord server ID", state, "discordServerId", { hint: "Live widget ke liye. Discord me Widget on hona chahiye." }));
      p.appendChild(field("Subreddit link", state, "redditUrl", { hint: "Khali = button nahi dikhega." }));
      p.appendChild(el("h3", {}, "Team"));
      p.appendChild(el("p", { class: "desc" }, "This list on the site is for display purposes only. The actual roles and permissions are set within Discord and Reddit."));
      const box = el("div"); p.appendChild(box);
      listEditor(box, state.team, [
        { label: "Name", key: "name" },
        { label: "Role", key: "role", type: "select", options: ["Owner", "Admin", "Mod"] }
      ], { name: "New member", role: "Mod" }, it => (it.name || "Member") + " (" + (it.role || "") + ")");
    },
    "Moderation": async p => {
      head(p, "Community posts", "User posts: Hide, delete, or ban the user.");
      const box = el("div"); p.appendChild(box);
      const s = getSb();
      const { data } = await s.from("posts").select("*, profiles(username,banned)").order("created_at", { ascending: false }).limit(100);
      if (!data || !data.length) { box.textContent = "Abhi koi post nahi."; return; }
      data.forEach(x => {
        const card = el("div", { class: "card" });
        const hd = el("div", { class: "cardhead" });
        hd.appendChild(el("b", {}, (x.profiles ? x.profiles.username : "user") + (x.hidden ? " (hidden)" : "")));
        const acts = el("div", { class: "acts" });
        const act = (t, fn, d) => { const b = el("button", { type: "button", class: "mini" + (d ? " danger" : "") }, t); b.addEventListener("click", async () => { await fn(); show("Moderation"); }); acts.appendChild(b); };
        act(x.hidden ? "Show" : "Hide", () => s.from("posts").update({ hidden: !x.hidden }).eq("id", x.id));
        act("Delete", () => s.from("posts").delete().eq("id", x.id), true);
        act(x.profiles && x.profiles.banned ? "Unban" : "Ban", () => s.from("profiles").update({ banned: !(x.profiles && x.profiles.banned) }).eq("id", x.user_id), true);
        hd.appendChild(acts); card.appendChild(hd);
        card.appendChild(el("p", {}, x.title + " - " + x.body));
        box.appendChild(card);
      });
    },
    "Publish": p => {
      head(p, "Save", "As soon as you hit save, it goes live on the site. No GitHub token is required.");
      const msg = el("div", { class: "msg", style: "display:none" });
      const setMsg = (t, k) => { msg.style.display = "block"; msg.textContent = t; msg.className = "msg " + (k || ""); };
      const b1 = el("button", { type: "button", class: "btn" }, "Save to website");
      const b2 = el("button", { type: "button", class: "btn ghost" }, "Download backup config.js");
      b1.addEventListener("click", async () => {
        b1.disabled = true;
        const clean = JSON.parse(JSON.stringify(state)); delete clean.supabaseUrl; delete clean.supabaseAnonKey;
        const { error } = await getSb().from("site_config").upsert({ id: 1, data: clean });
        b1.disabled = false;
        if (error) { setMsg("Save fail: " + error.message, "err"); return; }
        dirty = false; $("status").textContent = "Saved"; $("status").className = "";
        setMsg("Save successful. Refresh the site to see the changes.", "ok");
      });
      b2.addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([buildConfig()], { type: "text/javascript" }));
        a.download = "config.js"; document.body.appendChild(a); a.click(); a.remove();
      });
      const btns = el("div", { class: "btns" }); btns.appendChild(b1); btns.appendChild(b2);
      p.appendChild(btns); p.appendChild(msg);
    }
  };

  function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---------- Nav ----------
  const names = Object.keys(SECTIONS);
  function show(name) {
    const p = $("panel");
    p.textContent = "";
    SECTIONS[name](p);
    document.querySelectorAll("#nav button").forEach(b => {
      b.setAttribute("aria-current", b.textContent === name ? "true" : "false");
    });
    window.scrollTo(0, 0);
  }
  names.forEach(n => {
    const b = el("button", { type: "button" }, n);
    b.addEventListener("click", () => show(n));
    $("nav").appendChild(b);
  });
  show(names[0]);
})();
</script>
</body>
</html>
