<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - BladeLow</title><link rel="icon" href="pfp.jpg">
<link rel="stylesheet" href="styles.css">
<style>
  .shell { max-width: 440px; margin: 3rem auto; padding: 0 1rem; }
  .card { background: var(--ink2); border: 1px solid var(--line); border-radius: 12px; padding: 2rem; text-align: center; }
  .card img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover }
  .card h1 { margin: .5rem 0 1rem }
  .card p { color: var(--steel) }
</style>
</head><body>
<nav class="nav" aria-label="Main">
  <a class="brand" href="index.html"><img id="brandImg" alt=""><span id="brand">BladeLow</span></a>
  <div class="nav-right">
    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="tabs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span>Menu</span>
    </button>
    <div class="tabs" id="tabs">
      <a href="index.html#home">Home</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#community">Community</a>
      <a href="posts.html">Updates</a>
    </div>
    <a href="login.html" id="acct" class="login-btn" aria-current="page">Login</a>
  </div>
</nav>

<div class="shell"><div class="card"><img id="av" alt="" hidden><h1 id="h">Sign in</h1><p id="t">Login with your Discord account.</p><div id="b"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="auth.js"></script>
<script>
(async()=>{
  const b=document.getElementById("b");
  function btn(t,fn,ghost){const x=document.createElement("button");x.className="btn"+(ghost?" ghost":"");x.textContent=t;x.onclick=fn;b.appendChild(x)}
  function lnk(t,h){const x=document.createElement("a");x.className="btn ghost";x.textContent=t;x.href=h;b.appendChild(x)}
  if(!getSb()){document.getElementById("t").textContent="Setup baaki hai: config.js me supabaseUrl aur supabaseAnonKey daal (SETUP.md dekh).";return}
  const s=getSb();
  await s.auth.getSession();
  const u=await me();
  if(!u){btn("Sign in with Discord",loginDiscord);return}
  document.getElementById("h").textContent=u.username;
  document.getElementById("t").textContent=u.role==="admin"?"Admin account":"Logged in";
  if(u.avatar){const i=document.getElementById("av");i.src=u.avatar;i.hidden=false}
  lnk("Open community feed","community.html");
  if(u.role==="admin")lnk("Admin panel","admin.html");
  btn("Log out",logout,true);
  fillAcct();
})();
<script>
const mt=document.getElementById('menuToggle'),tb=document.getElementById('tabs');
mt.addEventListener('click',()=>{const o=tb.classList.toggle('menu-open');mt.setAttribute('aria-expanded',String(o));});
tb.addEventListener('click',e=>{if(e.target.closest('a')){tb.classList.remove('menu-open');mt.setAttribute('aria-expanded','false');}});
window.addEventListener('resize',()=>{if(window.innerWidth>700){tb.classList.remove('menu-open');mt.setAttribute('aria-expanded','false');}});
</script>
</body></html>
