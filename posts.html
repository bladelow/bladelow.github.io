<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Updates | BladeLow</title><link rel="icon" href="pfp.jpg"><link rel="stylesheet" href="styles.css">
<style>
  .posts-single header { padding: 1rem 0 0.5rem; border-bottom: 1px solid var(--line); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; }
  .posts-single header a { color: var(--ice); font-weight: 700; }
  .posts-single header a:hover { color: var(--edge); }
  .posts-single h1 { font-size: clamp(2.5rem, 7vw, 4.8rem); line-height: 1; letter-spacing: -.04em; margin: 0 0 14px; }
  .posts-single .intro { color: var(--muted); margin-bottom: 32px; }
  .posts-single .posts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 16px; }
  .posts-single .card { padding: 24px; background: var(--ink2); border: 1px solid var(--line); border-top: 3px solid var(--edge); min-width: 0; }
  .posts-single .date { color: var(--steel); font-size: .9rem; }
  .posts-single .card h2 { margin: 8px 0; font-size: 1.45rem; }
  .posts-single .summary { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ice); }
  .posts-single .empty { color: var(--steel); padding: 24px; border: 1px dashed var(--line); }
</style>
</head><body>
<nav class="nav" aria-label="Main">
  <a class="brand" href="index.html"><img id="brandImg" alt=""><span id="brand">BladeLow</span></a>
  <div class="nav-right">
    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="tabs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span>Menu</span>
    </button>
    <div class="tabs" id="tabs">
      <a href="index.html#home">Home</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#community">Community</a>
      <a href="posts.html" aria-current="page">Updates</a>
    </div>
    <a href="login.html" id="acct" class="login-btn">Login</a>
  </div>
</nav>

<div class="wrap posts-single">
  <header><a href="index.html">← Back to home</a></header>
  <main>
    <h1>Updates &amp; projects</h1>
    <p class="intro">The latest posts, announcements, and project updates.</p>
    <div id="posts" class="posts"></div>
  </main>
  <footer id="footer"></footer>
</div>

<script src="secrets.js"></script><script src="config.js"></script><script src="auth.js"></script>
<script>
const S=typeof SITE!=='undefined'?SITE:{},root=document.documentElement.style,T=S.theme||{};if(T.accent)root.setProperty('--edge',T.accent);if(T.muted)root.setProperty('--steel',T.muted);if(T.bg)root.setProperty('--ink',T.bg);if(T.panel)root.setProperty('--ink2',T.panel);if(T.text)root.setProperty('--ice',T.text);document.getElementById('brand').textContent=S.name||'BladeLow';document.getElementById('footer').textContent=S.footer||'';document.title='Updates | '+(S.name||'BladeLow');const host=document.getElementById('posts');const posts=[...(S.posts||[])].reverse();if(!posts.length){const p=document.createElement('p');p.className='empty';p.textContent='No updates published yet. Check back soon!';host.append(p)}posts.forEach(post=>{const c=document.createElement('article');c.className='card';const date=document.createElement('div');date.className='date';date.textContent=post.date||'';const h=document.createElement('h2');h.textContent=post.title||'Untitled post';const s=document.createElement('p');s.className='summary';s.textContent=post.summary||'';c.append(date,h,s);if(post.url){const a=document.createElement('a');a.href=post.url;a.textContent='Open project ↗';a.target='_blank';a.rel='noopener noreferrer';c.append(a)}host.append(c)});
fillAcct();
<script>
const mt=document.getElementById('menuToggle'),tb=document.getElementById('tabs');
mt.addEventListener('click',()=>{const o=tb.classList.toggle('menu-open');mt.setAttribute('aria-expanded',String(o));});
tb.addEventListener('click',e=>{if(e.target.closest('a')){tb.classList.remove('menu-open');mt.setAttribute('aria-expanded','false');}});
window.addEventListener('resize',()=>{if(window.innerWidth>700){tb.classList.remove('menu-open');mt.setAttribute('aria-expanded','false');}});
</script>
</body></html>
