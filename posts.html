<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Updates | BladeLow</title><style>
:root{--bg:#0c130e;--panel:#15201a;--muted:#9db89a;--text:#eef5ec;--accent:#57d13d;--line:#243428}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 system-ui,Segoe UI,sans-serif}a{color:var(--accent)}header{padding:18px 6vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header a{text-decoration:none;font-weight:700}main{width:min(1050px,88vw);margin:70px auto}h1{font-size:clamp(2.5rem,7vw,4.8rem);line-height:1;letter-spacing:-.04em;margin:0 0 14px}.intro{color:var(--muted);margin-bottom:32px}.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}.card{padding:24px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);min-width:0}.date{color:var(--muted);font-size:.9rem}.card h2{margin:8px 0;font-size:1.45rem}.summary{white-space:pre-wrap;overflow-wrap:anywhere}.empty{color:var(--muted);padding:24px;border:1px dashed var(--line)}footer{border-top:1px solid var(--line);padding:24px 6vw;color:var(--muted)}
</style></head><body><header><a id="brand" href="index.html">BladeLow</a><a href="index.html">← Back to home</a></header><main><h1>Updates & projects</h1><p class="intro">The latest posts, announcements, and project updates.</p><div id="posts" class="posts"></div></main><footer id="footer"></footer><script src="config.js"></script><script>
const S=typeof SITE!=='undefined'?SITE:{},root=document.documentElement.style,T=S.theme||{};if(T.accent)root.setProperty('--accent',T.accent);if(T.muted)root.setProperty('--muted',T.muted);if(T.bg)root.setProperty('--bg',T.bg);if(T.panel)root.setProperty('--panel',T.panel);if(T.text)root.setProperty('--text',T.text);document.getElementById('brand').textContent=S.name||'BladeLow';document.getElementById('footer').textContent=S.footer||'';document.title='Updates | '+(S.name||'BladeLow');const host=document.getElementById('posts');const posts=[...(S.posts||[])].reverse();if(!posts.length){const p=document.createElement('p');p.className='empty';p.textContent='No updates published yet. Check back soon!';host.append(p)}posts.forEach(post=>{const c=document.createElement('article');c.className='card';const date=document.createElement('div');date.className='date';date.textContent=post.date||'';const h=document.createElement('h2');h.textContent=post.title||'Untitled post';const s=document.createElement('p');s.className='summary';s.textContent=post.summary||'';c.append(date,h,s);if(post.url){const a=document.createElement('a');a.href=post.url;a.textContent='Open project ↗';a.target='_blank';a.rel='noopener noreferrer';c.append(a)}host.append(c)});
</script></body></html>
