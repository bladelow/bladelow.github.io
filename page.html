<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Page | BladeLow</title><style>
:root{--bg:#0c130e;--panel:#15201a;--muted:#9db89a;--text:#eef5ec;--accent:#57d13d;--line:#243428}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.75 system-ui,Segoe UI,sans-serif}a{color:var(--accent)}header{padding:18px 6vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header a{text-decoration:none;font-weight:700}main{width:min(850px,88vw);margin:clamp(40px,8vw,100px) auto}h1{font-size:clamp(2.2rem,7vw,4.5rem);line-height:1.05;letter-spacing:-.04em;margin:0 0 18px}#desc{color:var(--muted);font-size:1.1rem}article{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:32px}footer{border-top:1px solid var(--line);padding:24px 6vw;color:var(--muted)}.missing{padding:18px;background:var(--panel);border-left:3px solid var(--accent)}
</style></head><body><header><a id="brand" href="index.html">BladeLow</a><a href="index.html">← Back to home</a></header><main><p id="eyebrow" style="color:var(--accent);font-weight:700">PAGE</p><h1 id="title">Loading…</h1><p id="desc"></p><article id="content"></article><p id="missing" class="missing" hidden>Page not found. It may have been renamed or removed.</p></main><footer id="footer"></footer><script src="config.js"></script><script>
const S=typeof SITE!=='undefined'?SITE:{},q=new URLSearchParams(location.search),slug=q.get('slug')||'',p=(S.pages||[]).find(x=>x.slug===slug);const root=document.documentElement.style,T=S.theme||{};if(T.accent)root.setProperty('--accent',T.accent);if(T.muted)root.setProperty('--muted',T.muted);if(T.bg)root.setProperty('--bg',T.bg);if(T.panel)root.setProperty('--panel',T.panel);if(T.text)root.setProperty('--text',T.text);document.getElementById('brand').textContent=S.name||'BladeLow';document.getElementById('footer').textContent=S.footer||'';if(p){document.title=(p.title||'Page')+' | '+(S.name||'BladeLow');document.getElementById('title').textContent=p.title||'Untitled page';document.getElementById('desc').textContent=p.description||'';document.getElementById('content').textContent=p.content||'';}else{document.getElementById('title').textContent='Page not found';document.getElementById('missing').hidden=false;document.getElementById('eyebrow').hidden=true;}
</script></body></html>
