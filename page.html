<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Page | BladeLow</title><link rel="icon" href="pfp.jpg"><link rel="stylesheet" href="styles.css">
<style>
  .page-single header { padding: 1rem 0 0.5rem; border-bottom: 1px solid var(--line); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; }
  .page-single header a { color: var(--ice); font-weight: 700; }
  .page-single header a:hover { color: var(--edge); }
  .page-single .eyebrow { color: var(--edge); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; }
  article { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; color: var(--ice); }
  .missing { padding: 1rem 1.2rem; background: var(--ink2); border-left: 3px solid var(--edge); color: var(--steel); }
</style>
</head><body>
<nav class="nav" aria-label="Main">
  <a class="brand" href="index.html"><img id="brandImg" alt=""><span id="brand">BladeLow</span></a>
  <div class="nav-right">
    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="tabs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span>Menu</span>
    </button>
    <div class="tabs" id="tabs">
      <a href="index.html#home">Home</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#community">Community</a>
      <a href="posts.html">Updates</a>
    </div>
    <a href="login.html" id="acct" class="login-btn">Login</a>
  </div>
</nav>

<div class="wrap page-single">
  <header><a href="index.html">← Back to home</a></header>
  <main>
    <p id="eyebrow" class="eyebrow">PAGE</p>
    <h1 id="title">Loading…</h1>
    <p id="desc"></p>
    <article id="content"></article>
    <p id="missing" class="missing" hidden>Page not found. It may have been renamed or removed.</p>
  </main>
  <footer id="footer"></footer>
</div>

<script src="config.js"></script><script src="auth.js"></script>
<script>
const S=typeof SITE!=='undefined'?SITE:{},q=new URLSearchParams(location.search),slug=q.get('slug')||'',p=(S.pages||[]).find(x=>x.slug===slug);const root=document.documentElement.style,T=S.theme||{};if(T.accent)root.setProperty('--edge',T.accent);if(T.muted)root.setProperty('--steel',T.muted);if(T.bg)root.setProperty('--ink',T.bg);if(T.panel)root.setProperty('--ink2',T.panel);if(T.text)root.setProperty('--ice',T.text);document.getElementById('brand').textContent=S.name||'BladeLow';document.getElementById('footer').textContent=S.footer||'';document.title=(p&&p.title?p.title+' | ':'')+(S.name||'BladeLow');if(p){document.getElementById('title').textContent=p.title||'Untitled page';document.getElementById('desc').textContent=p.description||'';document.getElementById('content').textContent=p.content||'';}else{document.getElementById('title').textContent='Page not found';document.getElementById('missing').hidden=false;document.getElementById('eyebrow').hidden=true;}
fillAcct();
<script>
const mt=document.getElementById('menuToggle'),tb=document.getElementById('tabs');
mt.addEventListener('click',()=>{const o=tb.classList.toggle('menu-open');mt.setAttribute('aria-expanded',String(o));});
tb.addEventListener('click',e=>{if(e.target.closest('a')){tb.classList.remove('menu-open');mt.setAttribute('aria-expanded','false');}});
window.addEventListener('resize',()=>{if(window.innerWidth>700){tb.classList.remove('menu-open');mt.setAttribute('aria-expanded','false');}});
</script>
</body></html>
